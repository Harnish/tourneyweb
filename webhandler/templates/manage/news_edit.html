{{define "manageNewsEdit"}}
{{template "header" .}}
<link rel="stylesheet" href="https://cdn.quilljs.com/1.3.7/quill.snow.css">
<h2>Edit News &mdash; {{.Tournament.Name}}</h2>
<form method="post" action="/tournaments/{{.Tournament.ID}}/manage/news/{{.Item.ID}}/edit" id="news-edit-form">
{{.CSRFField}}
<table>
<tr><td>Title</td><td><input type="text" name="title" value="{{.Item.Title}}" required size="50"></td></tr>
</table>
<div id="editor" style="height:200px;margin-bottom:1em;"></div>
<textarea id="existing_content" style="display:none">{{.Item.Body}}</textarea>
<input type="hidden" name="news_html" id="news_html_input">
<input type="submit" value="Save">
&nbsp;<a href="/tournaments/{{.Tournament.ID}}/manage/news">Cancel</a>
</form>
<script src="https://cdn.quilljs.com/1.3.7/quill.js"></script>
<script>
var quill = new Quill('#editor', {
  theme: 'snow',
  modules: { toolbar: [
    [{ 'header': [1, 2, 3, false] }],
    ['bold', 'italic', 'underline'],
    ['link'],
    [{ 'list': 'ordered' }, { 'list': 'bullet' }],
    ['clean']
  ]}
});
var existing = document.getElementById('existing_content').value;
if (existing.trim()) {
  quill.clipboard.dangerouslyPasteHTML(existing);
}
document.getElementById('news-edit-form').addEventListener('submit', function() {
  document.getElementById('news_html_input').value = quill.root.innerHTML;
});
</script>
{{template "footer" .}}
{{end}}
