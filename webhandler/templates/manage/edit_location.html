{{define "manageLocationEdit"}}
{{template "header" .}}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<h1>Edit Location</h1>
<form method="post" action="/tournaments/{{.Tournament.ID}}/manage/locations/{{.Location.ID}}/edit">
{{.CSRFField}}
<table>
  <tr><td>Name</td><td><input type="text" name="name" value="{{.Location.Name}}" required></td></tr>
  <tr><td>Address</td><td><input type="text" name="address" value="{{.Location.Address}}"></td></tr>
  <tr><td>Latitude</td><td><input type="text" name="latitude" id="lat_edit" value="{{.Location.Latitude}}"></td></tr>
  <tr><td>Longitude</td><td><input type="text" name="longitude" id="lng_edit" value="{{.Location.Longitude}}"></td></tr>
</table>
<p>Click the map to reposition the pin:</p>
<div id="edit-map" style="height:350px;width:100%;max-width:700px;margin-bottom:0.5em;"></div>
<input type="submit" value="Save"> &nbsp; <a href="/tournaments/{{.Tournament.ID}}/manage/locations" class="tw-back">Cancel</a>
</form>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV/XN/WPeE=" crossorigin=""></script>
<script>
L.Icon.Default.mergeOptions({
  iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
  iconRetinaUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png',
  shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
});
var loc = {{.LocationJSON}};
var hasPin = loc.lat !== 0 || loc.lng !== 0;
var center = hasPin ? [loc.lat, loc.lng] : [39, -98];
var zoom   = hasPin ? 15 : 4;
var editMap = L.map('edit-map').setView(center, zoom);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(editMap);
var editMarker = hasPin ? L.marker([loc.lat, loc.lng]).addTo(editMap) : null;
editMap.on('click', function(e) {
  if (editMarker) editMap.removeLayer(editMarker);
  editMarker = L.marker(e.latlng).addTo(editMap);
  document.getElementById('lat_edit').value = e.latlng.lat.toFixed(6);
  document.getElementById('lng_edit').value = e.latlng.lng.toFixed(6);
});
</script>
{{template "footer" .}}
{{end}}
