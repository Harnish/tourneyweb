{{define "passwordResetConfirm"}}
{{template "header" .}}
<h2>Choose New Password</h2>
{{if .Error}}<p style="color:red">{{.Error}}</p>{{end}}
<form method="post" action="/password-reset/confirm">
<input type="hidden" name="token" value="{{.Token}}">
<table>
<tr><td>New Password</td><td><input type="password" name="password" required minlength="8"></td></tr>
<tr><td>Confirm Password</td><td><input type="password" name="confirm" required minlength="8"></td></tr>
<tr><td></td><td><input type="submit" value="Set Password"></td></tr>
</table>
{{.CSRFField}}
</form>
{{template "footer" .}}
{{end}}
